name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # NextAuth refuses every request (including credentials sign-in) with a
      # generic "Configuration" error if no secret is set — this repo has no
      # CI secrets configured, so a throwaway value is fine here.
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-not-used-in-production
      # Lets tests/e2e/adminUsersColumnSearch.spec.ts sign up and sign in as
      # an admin account (requireAdmin() in src/app/admin/**/page.tsx gates on
      # an exact process.env.ADMIN_EMAIL match) to cover /admin/users e2e.
      ADMIN_EMAIL: e2e-admin@test.local
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # CI has no access to the real prompt_template / prompt_pilot_template
      # copy (data/seeds/*.local.json are gitignored, developer-machine-only —
      # the template text is core IP, see scripts/seed-prompt-templates.js).
      # Without at least one is_fallback row in each table,
      # renderPromptTemplate() always returns null here, which makes
      # OpportunityFinderFlow/PromptPilot fall into their "no prompt
      # returned" error branch instead of rendering PromptDisplay, breaking
      # e2e specs that expect that screen. Seed from the committed, safe
      # placeholder files instead — their placeholder template_text is fine
      # for e2e purposes since no e2e test asserts on rendered prompt
      # content, only on which screen/button appears.
      - name: Seed placeholder prompt templates for e2e
        run: |
          PROMPT_TEMPLATE_SEED_PATH=./data/seeds/prompt-templates.example.json npm run seed:prompt-templates
          PROMPT_PILOT_TEMPLATE_SEED_PATH=./data/seeds/prompt-pilot-templates.example.json npm run seed:prompt-pilot-templates

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
